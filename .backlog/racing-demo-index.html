<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velocity — Browser Racing Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }

    #debug-hud {
      position: fixed;
      top: 16px;
      left: 16px;
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      color: #0ff;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid rgba(0,255,255,0.15);
      pointer-events: none;
      z-index: 100;
      line-height: 1.7;
      text-shadow: 0 0 6px rgba(0,255,255,0.4);
      min-width: 220px;
    }
    #debug-hud .label { color: rgba(255,255,255,0.45); font-size: 10px; letter-spacing: 1px; }
    #debug-hud .value { color: #0ff; font-weight: 700; }
    #debug-hud .speed-big {
      font-size: 42px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px rgba(0,255,255,0.6), 0 0 60px rgba(0,255,255,0.2);
      line-height: 1;
    }
    #debug-hud .unit { font-size: 14px; color: rgba(255,255,255,0.5); font-weight: 400; }

    #controls-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(6px);
      padding: 10px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
      z-index: 100;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    #controls-hint kbd {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 1px 6px;
      margin: 0 2px;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.7);
    }

    #gear-indicator {
      position: fixed;
      bottom: 20px;
      right: 30px;
      font-family: 'Orbitron', monospace;
      z-index: 100;
      pointer-events: none;
      text-align: center;
    }
    #gear-indicator .gear-label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 2px; }
    #gear-indicator .gear-value {
      font-size: 64px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px rgba(0,255,255,0.4);
      line-height: 1;
    }
  </style>
</head>
<body>
  <div id="debug-hud">
    <div class="label">SPEED</div>
    <div><span class="speed-big" id="hud-speed">0</span> <span class="unit">KM/H</span></div>
    <br/>
    <div class="label">RPM</div>
    <div class="value" id="hud-rpm">0</div>
    <div class="label">THROTTLE</div>
    <div class="value" id="hud-throttle">0%</div>
    <div class="label">STEER</div>
    <div class="value" id="hud-steer">0.00</div>
    <div class="label">DRIFT</div>
    <div class="value" id="hud-drift">—</div>
    <div class="label">FPS</div>
    <div class="value" id="hud-fps">0</div>
  </div>

  <div id="gear-indicator">
    <div class="gear-label">GEAR</div>
    <div class="gear-value" id="hud-gear">N</div>
  </div>

  <div id="controls-hint">
    <kbd>W</kbd> / <kbd>↑</kbd> Accelerate &nbsp;
    <kbd>S</kbd> / <kbd>↓</kbd> Brake &nbsp;
    <kbd>A</kbd> / <kbd>↓</kbd> Left &nbsp;
    <kbd>D</kbd> / <kbd>→</kbd> Right &nbsp;
    <kbd>Space</kbd> Handbrake &nbsp;
    <kbd>Shift</kbd> Nitro &nbsp;
    <kbd>C</kbd> Camera &nbsp;
    <kbd>R</kbd> Reset
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
